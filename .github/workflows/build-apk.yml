name: KwaiAutomatico APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-22.04
env:
JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

```
steps:
  - name: Baixar projeto
    uses: actions/checkout@v4

  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Instalar dependencias
    run: |
      sudo apt-get update
      sudo apt-get install -y git zip unzip wget openjdk-17-jdk

  - name: Configurar Java
    run: |
      java -version
      javac -version

  - name: Instalar Buildozer
    run: |
      python -m pip install --upgrade pip
      pip install buildozer
      pip install "cython==0.29.37"

  - name: Construir APK
    run: |
      buildozer android debug

  - name: Verificar APK
    run: |
      ls -lah bin/

  - name: Salvar APK
    uses: actions/upload-artifact@v4
    with:
      name: KwaiAutomatico-APK
      path: bin/*.apk
```
