name: KwaiAutomatico APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remover repositorios Microsoft problematicos
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            wget

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.37"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar AIDL
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print

      - name: Limpar arquivos antigos
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Construir APK
        run: |
          buildozer android debug

      - name: Verificar APK
        run: |
          ls -lah bin/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: KwaiAutomatico-APK
          path: bin/*.apk
