name: KwaiAutomatico APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Desativar repositorios Microsoft
        run: |
          sudo find /etc/apt/sources.list.d -type f \
            -exec sed -i '/packages.microsoft.com/s/^/#/' {} \;

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.37"

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Limpar arquivos antigos
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Construir APK
        run: |
          yes | buildozer android debug

      - name: Verificar APK
        run: |
          ls -lah bin/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: KwaiAutomatico-APK
          path: bin/*.apk
