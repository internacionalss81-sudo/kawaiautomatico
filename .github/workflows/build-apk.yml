name: KwaiAutomatico APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Configure Java 17
        run: |
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
          java -version
          javac -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.37"

      - name: Prepare Android SDK
        run: |
          set -e

          SDK="$ANDROID_HOME"

          rm -rf "$SDK"
          mkdir -p "$SDK/cmdline-tools/latest"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -O /tmp/cmdline-tools.zip

          rm -rf /tmp/android-sdk
          mkdir -p /tmp/android-sdk

          unzip -q /tmp/cmdline-tools.zip \
            -d /tmp/android-sdk

          cp -r /tmp/android-sdk/cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          chmod +x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Install Android components
        run: |
          set -e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          set -e

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "SDK Manager:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --version

          echo "Build Tools:"
          ls -lah "$ANDROID_HOME/build-tools/35.0.0"

          echo "AIDL:"
          ls -lah "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" --version

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug

      - name: Verify APK
        run: |
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KwaiAutomatico-APK
          path: bin/*.apk
