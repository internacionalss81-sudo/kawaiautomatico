name: KwaiAutomatico APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remover repositorios Microsoft
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Confirmar Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.37"

      - name: Preparar SDK Android do Buildozer
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          CMD="$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -O /tmp/android-cmdline-tools.zip

          rm -rf "$CMD"
          mkdir -p "$CMD"

          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools/* "$CMD"/

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CMD/bin" >> "$GITHUB_PATH"

      - name: Instalar ferramentas Android
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar AIDL
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK:"
          echo "$SDK"

          echo ""
          echo "Build Tools:"
          ls -lah "$SDK/build-tools"

          echo ""
          echo "AIDL:"
          find "$SDK/build-tools" -name aidl -type f -print

          echo ""
          echo "SDK Manager:"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list | head -30

      - name: Limpar arquivos antigos
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Recriar SDK depois da limpeza
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          if [ ! -d "$SDK/build-tools/35.0.0" ]; then
            echo "Build Tools não encontrados."
            exit 1
          fi

          if [ ! -f "$SDK/build-tools/35.0.0/aidl" ]; then
            echo "AIDL não encontrado."
            exit 1
          fi

          echo "AIDL encontrado com sucesso."

      - name: Construir APK
        run: |
          buildozer android debug

      - name: Verificar APK
        run: |
          echo "Arquivos APK encontrados:"
          ls -lah bin/

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: KwaiAutomatico-APK
          path: bin/*.apk
